# One Railway project, five services from this monorepo (api + indexer + data-api + agents + bot).
# Vercel: apps/web (Float) and apps/site. Wire tokens at deploy. Do not block local S0 on Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
