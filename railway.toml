# Monorepo Railway project: five backend services + Postgres (DATABASE_URL).
# Per-service config: apps/{api,data-api,indexer,bot,agents}/railway.toml
# Vercel: apps/web (Float) and apps/site. Do not block local S0 on Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
