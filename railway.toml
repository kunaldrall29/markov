# Monorepo Railway project: five backend services + Postgres (DATABASE_URL).
# Per-service Dockerfiles: apps/{api,data-api,indexer,bot,agents}/Dockerfile.
# Railway CLI 5.x ignores railway.toml (config-as-code deprecated). dockerfilePath
# and /health are set on each service instance. Vercel: apps/web and apps/site.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
